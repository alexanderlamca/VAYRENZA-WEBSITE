let activeKey='S';
function keyFromHash(){const m=location.hash.match(/^#vz-([stp])$/i);return m?m[1].toUpperCase():null}
function render(lang){const c=copy[lang]||copy.en;document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=c[el.dataset.t]);document.querySelectorAll('[data-nav]').forEach(el=>el.textContent=c.nav[Number(el.dataset.nav)]);activeKey=keyFromHash()||activeKey;const keys=['S','T','P'];const wrap=document.getElementById('collections');wrap.innerHTML=`<div class="series-tabs" role="tablist">${keys.map((k,si)=>`<button class="series-tab" id="tab-${k}" role="tab" aria-controls="panel-${k}" aria-selected="${activeKey===k}" data-series="${k}"><div class="series-index">0${si+1}</div><div class="series-code">VZ-${k} SERIES</div><h2 class="series-title">${c.series[si]}</h2><span class="series-count">${products[k].count} SKUs</span></button>`).join('')}</div><div class="series-stage" id="series-stage"></div>`;wrap.querySelectorAll('.series-tab').forEach(btn=>btn.addEventListener('click',()=>openSeries(btn.dataset.series,lang,true)));openSeries(activeKey,lang,false);localStorage.setItem('vayrenza-language',lang)}
function openSeries(k,lang,updateHash){activeKey=k;const c=copy[lang]||copy.en,pk=lang==='zh-CN'?'zh':lang,keys=['S','T','P'],si=keys.indexOf(k),p=products[k];document.querySelectorAll('.series-tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.series===k)));const stage=document.getElementById('series-stage');const cards=p[pk].map((name,i)=>{const sku=`VZ-${k}${String(i+1).padStart(3,'0')}`;if(k==='S'){const src=`assets/products/s-series/${sku}.png`;return `<article class="product-card has-image"><div class="product-visual" data-full="${src}" data-sku="${sku}" data-name="${name}" tabindex="0" role="button" aria-label="${c.view}: ${sku} ${name}"><img src="${src}" alt="${sku} ${name}" loading="lazy"><span class="view-full">${c.view}</span></div><div class="product-info"><div class="sku">${sku}</div><h3>${name}</h3><p class="product-benefit">${sBenefits[i]}</p><div class="state">${c.state}</div></div></article>`}return `<article class="product-card"><div class="sku">${sku}</div><h3>${name}</h3><div class="state">${c.state}</div></article>`}).join('');stage.innerHTML=`<div class="series-stage-head"><div class="series-label">VZ-${k} SERIES · ${p.count} SKUs</div><p class="series-description">${c.desc[si]}</p></div><div class="product-rail" id="panel-${k}" role="tabpanel" aria-labelledby="tab-${k}">${cards}</div>`;bindImagePreview();if(updateHash)history.replaceState(null,'',`#vz-${k.toLowerCase()}`)}
function bindImagePreview(){document.querySelectorAll('.product-visual').forEach(el=>{const open=()=>openModal(el.dataset.full,`${el.dataset.sku} · ${el.dataset.name}`);el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})})}
const modal=document.getElementById('image-modal'),modalImage=document.getElementById('modal-image'),modalCaption=document.getElementById('modal-caption');function openModal(src,caption){modalImage.src=src;modalImage.alt=caption;modalCaption.textContent=caption;modal.classList.add('open');document.body.style.overflow='hidden'}function closeModal(){modal.classList.remove('open');modalImage.src='';document.body.style.overflow=''}document.getElementById('modal-close').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.classList.contains('open'))closeModal()});
const sel=document.getElementById('lang');let saved=localStorage.getItem('vayrenza-language');if(!copy[saved])saved='en';sel.value=saved;sel.addEventListener('change',()=>render(sel.value));window.addEventListener('hashchange',()=>{const k=keyFromHash();if(k)openSeries(k,sel.value,false)});render(saved);
</script></body></html>
